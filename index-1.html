<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>구내식당 식수인원 점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 한 장의 식권처럼 — 상단 '오늘' 카드(진한 남색) 아래로 등록·예정 목록이 촘촘히 이어지는 1열 구성 */
:root{
  --bg:#f2f4f7;--surface:#ffffff;--ink:#161a22;--sub:#667085;--line:#e3e7ee;
  --accent:#2a48a6;--accent-ink:#ffffff;--accent-soft:#edf1fb;
  --hero:#1a2846;--hero-ink:#f4f6fb;--hero-sub:#a8b5d4;--hero-line:#2c3c60;
  --note:#9a4d00;--note-bg:#fff1e0;--ok:#17784a;--ok-bg:#e6f4ec;--err:#b42318;--err-bg:#fdecea;--demo-bg:#fff5d6;--demo-ink:#6f5300;
  --font:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116;--surface:#171a21;--ink:#e7eaf0;--sub:#8d96a7;--line:#262b35;
    --accent:#7f9ef3;--accent-ink:#0d1222;--accent-soft:#1b2339;
    --hero:#1c2a48;--hero-ink:#eef2fa;--hero-sub:#9fb0d6;--hero-line:#2f4069;
    --note:#ffb766;--note-bg:#3a2611;--ok:#4cc38a;--ok-bg:#14301f;--err:#ff7a6b;--err-bg:#3a1d1a;--demo-bg:#352e14;--demo-ink:#f0d07a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0f1116;--surface:#171a21;--ink:#e7eaf0;--sub:#8d96a7;--line:#262b35;
    --accent:#7f9ef3;--accent-ink:#0d1222;--accent-soft:#1b2339;
    --hero:#1c2a48;--hero-ink:#eef2fa;--hero-sub:#9fb0d6;--hero-line:#2f4069;
    --note:#ffb766;--note-bg:#3a2611;--ok:#4cc38a;--ok-bg:#14301f;--err:#ff7a6b;--err-bg:#3a1d1a;--demo-bg:#352e14;--demo-ink:#f0d07a;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:440px;margin:0 auto;padding-block:14px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top h1{font-size:15px;font-weight:700;margin:0;letter-spacing:-.01em}
.top span{display:block;font-size:12px;color:var(--sub)}
.adminbtn{flex:0 0 auto;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--sub)}
.adminbtn:hover{color:var(--accent);border-color:var(--accent)}
.demo{padding:7px 10px;border-radius:8px;background:var(--demo-bg);color:var(--demo-ink);font-size:12px}
#app{display:flex;flex-direction:column;gap:10px}

/* 오늘 카드 */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:14px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hdate{font-size:14px;font-weight:600}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--hero-line);color:var(--hero-sub)}
.pill.open{color:var(--hero-ink);border-color:var(--hero-sub)}
.hero-mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px}
.hlabel{font-size:12px;color:var(--hero-sub)}
.hnum{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hnum small{font-size:14px;font-weight:500;margin-left:2px;color:var(--hero-sub)}
.hmeta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--hero-sub)}
.icon{background:none;border:0;color:var(--hero-sub);font-size:12px;padding:2px 0}
.hlist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--hero-line);list-style:none}
.hlist li,.hitem{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--hero-line);border:0;color:var(--hero-ink)}
.hitem:hover{outline:1px solid var(--hero-sub)}
.hitem::after{content:"수정";margin-left:6px;font-size:10px;color:var(--hero-sub)}
.hlist b{font-weight:600;margin-left:4px}

/* 섹션 */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 0;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.02em}
.sec small{font-weight:400;font-size:11px}
.badge{font-style:normal;font-size:11px;font-weight:600;margin-left:6px;padding:2px 7px;border-radius:999px;background:var(--note-bg);color:var(--note);letter-spacing:0;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.depts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px;padding:8px;align-items:stretch}
.opt{min-height:44px;padding:5px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:500;line-height:1.3;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.opt .l1{display:block;font-size:10.5px;font-weight:500;color:var(--sub)}
.opt .l2{display:block;font-size:12.5px;font-weight:600}
.opt:hover{border-color:var(--accent);color:var(--accent)}
.opt:hover .l1{color:var(--accent)}
.opt:active{background:var(--accent-soft)}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rdate{font-weight:600;font-size:13px}
.rdepts{font-size:12px;color:var(--sub);min-width:0;display:flex;flex-wrap:wrap;gap:4px 10px}
.ritem{background:none;border:0;padding:0;font-size:12px;color:var(--sub);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.ritem:hover{color:var(--accent);text-decoration-color:var(--accent)}
.rtotal{font-weight:700;color:var(--accent);font-size:15px}
.empty{padding:14px;text-align:center;color:var(--sub);font-size:12.5px}
.row.none .rdate,.row.none .rdepts,.row.none .rtotal{color:var(--sub);font-weight:400}
.depts .empty,.depts .msg{grid-column:1/-1}
/* 관리자 */
.field{width:100%;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.field:focus{border-color:var(--accent);outline:none}
.pad .field + .primary{margin-top:10px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.acell{min-width:0}
.aid{display:block;font-size:10.5px;color:var(--sub);margin:3px 2px 0}
.abtns{display:flex;gap:6px;align-self:start}
.abtn{height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.abtn.save,.abtn.add{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.abtn.del{color:var(--err)}
.abtn.del.armed{background:var(--err);border-color:var(--err);color:var(--surface)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px}
.range{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;align-items:center}
.range .field{padding:0 6px;font-size:13px}
.quick{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.qbtn{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--sub)}
.qbtn:hover{color:var(--accent);border-color:var(--accent)}
.rsum{font-size:12.5px;color:var(--sub);margin:10px 0 6px}
.rsum b{color:var(--ink)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.pv{margin:0;font-size:12px;min-width:100%;white-space:nowrap}
table.pv th,table.pv td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.pv th:first-child,table.pv td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.pv thead th{border-top:0;background:var(--bg);font-weight:600;vertical-align:bottom}
table.pv thead th:first-child{background:var(--bg)}
table.pv th .l1{display:block;font-size:10px;font-weight:400;color:var(--sub)}
table.pv th .l2{display:block}
table.pv tfoot td{font-weight:700;background:var(--accent-soft)}
table.pv tfoot td:first-child{background:var(--accent-soft)}
#rDown{margin-top:10px}
.link-out{align-self:center;background:none;border:0;color:var(--sub);font-size:12px;text-decoration:underline;padding:4px}

/* 입력 화면 */
.formhead{display:flex;align-items:center;justify-content:space-between}
.back{background:none;border:0;color:var(--accent);font-size:13px;padding:4px 0}
.formhead b{font-size:15px}
.pad{padding:12px 14px}
.flabel{font-size:12px;color:var(--sub);font-weight:600;margin:0 0 6px}
.flabel + .chips{margin-bottom:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:58px;padding:5px 6px 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:center;line-height:1.25}
.chip .tag{display:block;font-size:10px;min-height:13px;color:var(--sub)}
.chip b{display:block;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .tag{color:var(--accent-ink);opacity:.8}
.chip .cnt{display:block;font-size:10px;min-height:13px;font-weight:600;color:var(--accent)}
.chip.has{border-color:var(--accent)}
.chip.on .cnt{color:var(--accent-ink)}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.stepper input{width:76px;height:42px;text-align:center;font-size:24px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--surface);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.status{text-align:center;font-size:12.5px;color:var(--sub);margin-top:8px;min-height:18px}
.status b{color:var(--accent)}
.late{color:var(--note);font-size:12px;font-weight:600}
.primary{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:600;margin-top:10px}
.ghost{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--err);font-size:13px;margin-top:6px}
.primary:disabled,.ghost:disabled{opacity:.45}
.msg{padding:9px 12px;border-radius:8px;font-size:13px;text-align:center}
.pad .msg{margin-top:8px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--err-bg);color:var(--err)}
.foot{color:var(--sub);font-size:11.5px;text-align:center;line-height:1.6;margin:2px 0 0}
@media (prefers-reduced-motion:no-preference){.msg{animation:fade .25s ease-out}}
@keyframes fade{from{opacity:.4}to{opacity:1}}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>구내식당 식수인원 점검</h1>
    <button class="adminbtn" id="adminBtn" aria-label="관리자 화면">관리자</button>
  </header>
  <div class="demo" id="demo" hidden>미리보기 모드 · 서버 미연결, 이 기기에만 저장되며 예시 데이터가 들어 있습니다.</div>
  <div id="app"></div>
</main>

<script>
/* ============================================================
   [설정] 운영 전 수정할 부분은 이 블록뿐입니다.
   - API_URL : 저장 주소 (Vercel 사이트에서는 자동으로 /api/meal 사용)
   - MIN_COUNT, DEADLINE_HOUR, DEADLINE_MIN : api/meal.js와 같은 값이어야 함
   - DEFAULT_COUNT : 새로 등록할 때 처음 표시되는 인원(기본 6명)
   - CLOSE_HOUR, CLOSE_MIN : 실제 마감(화면에는 표시하지 않음, api/meal.js와 같게)
   ※ 소속 목록은 [관리자] 화면에서 관리합니다(Upstash Redis에 저장).
   ※ 관리자 비밀번호는 Vercel 환경변수 ADMIN_PW에만 있습니다.
   ============================================================ */
// 저장 주소: Vercel 사이트에서는 같은 주소의 /api/meal(서버 함수 + Upstash Redis)을 사용
// 그 밖의 곳(파일 미리보기 등)에서 열면 미리보기 모드로 동작
const API_URL = /\.vercel\.app$/.test(location.hostname) ? "/api/meal" : "";
const MIN_COUNT = 1;        // 최소 등록 인원 (5명 미만도 등록 가능)
const DEFAULT_COUNT = 6;    // 새 등록 시 기본 표시 인원
const MAX_COUNT = 300;      // 입력 상한(오입력 방지)
const DEADLINE_HOUR = 9;    // 당일 마감 시각(시)
const DEADLINE_MIN = 30;    // 당일 마감 시각(분) → 오전 9시 30분 (화면 표시용)
const CLOSE_HOUR = 12;      // 실제 마감 시각(시) — 표시하지 않음. 이 시각까지 신규 등록·수정 가능
const CLOSE_MIN = 0;        // 실제 마감 시각(분)
const DAY_COUNT = 7;        // 입력 화면에 보여줄 날짜 수
const SKIP_WEEKEND = true;  // 주말 제외
/* ============================================================ */

const $ = s => document.querySelector(s);
const app = $("#app");
const W = ["일","월","화","수","목","금","토"];
let DEPTS = {};             // 서버에서 불러온 부서 목록 {부서ID: 부서명}
const st = { dept:null, date:null, current:0, value:DEFAULT_COUNT, busy:false, token:0, armed:false, mine:{}, pw:null, days:null, range:null, rec:null };

/* ---- 저장소(브라우저 저장이 막힌 환경 대비) ---- */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};

/* ---- 한국시간 기준 날짜 계산 ---- */
function kst(){
  const parts = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const o = {}; parts.forEach(p => o[p.type] = p.value);
  // late: 실제 마감(CLOSE)이 지났는지 — 등록 가능 여부 판단용
  // shownLate: 표시 마감(DEADLINE)이 지났는지 — 화면 문구용
  const now = Number(o.hour) * 60 + Number(o.minute);
  const late = now >= CLOSE_HOUR * 60 + CLOSE_MIN;
  const shownLate = now >= DEADLINE_HOUR * 60 + DEADLINE_MIN;
  return { date:`${o.year}-${o.month}-${o.day}`, hour:Number(o.hour), hm:`${o.hour}:${o.minute}`, late, shownLate };
}
// 화면 표시용 마감 문구: "오전 9시 30분"
function deadlineText(){ const h = DEADLINE_HOUR, m = DEADLINE_MIN; return `${h < 12 ? "오전" : "오후"} ${h % 12 || 12}시${m ? ` ${m}분` : ""}`; }
function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function dow(s){ const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function isWeekend(s){ const w = dow(s); return w === 0 || w === 6; }
function fmt(s){ const [,m,d]=s.split("-").map(Number); return `${m}/${d}(${W[dow(s)]})`; }
function longDate(s){ const [y,m,d]=s.split("-").map(Number); return `${y}. ${m}. ${d}. (${W[dow(s)]})`; }
function closed(s){ const t=kst(); return s < t.date || (s === t.date && t.late); }
// 오늘 마감 이후 여부 (이때는 기존 등록의 수정·취소만 허용)
function lateToday(s){ const t=kst(); return s === t.date && t.late; }
function dateList(){
  const t = kst();
  let s = !t.late ? t.date : addDays(t.date,1);
  const out = [];
  while(out.length < DAY_COUNT){
    if(!(SKIP_WEEKEND && isWeekend(s))) out.push(s);
    s = addDays(s,1);
  }
  return out;
}
// 식수인원 현황: 내일부터 1주일(7일), 주말 제외 설정 시 평일만
function weekDates(){
  const t = kst().date, out = [];
  for(let i = 1; i <= 7; i++){ const s = addDays(t,i); if(!(SKIP_WEEKEND && isWeekend(s))) out.push(s); }
  return out;
}
function tagOf(s){ const t=kst().date; return s===t ? "오늘" : s===addDays(t,1) ? "내일" : "&nbsp;"; }
// 부서 버튼 표기: 첫 띄어쓰기 앞은 윗줄, 뒤는 아랫줄 (예: "한강서부 경영보상부" → 한강서부 / 경영보상부)
function deptLabel(name){
  const s = String(name).trim(), i = s.indexOf(" ");
  if(i < 0) return `<span class="l2">${esc(s)}</span>`;
  return `<span class="l1">${esc(s.slice(0,i))}</span><span class="l2">${esc(s.slice(i+1))}</span>`;
}
function esc(v){ return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---- 서버 통신 ---- */
async function api(params, body){
  if(!API_URL) return mockApi(params, body);
  try{
    let r;
    if(body){
      r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    }else{
      r = await fetch(API_URL + "?" + new URLSearchParams(params).toString(), {cache:"no-store"});
    }
    return await r.json();
  }catch(e){
    return { ok:false, error:"연결에 실패했습니다. 잠시 후 다시 시도해 주세요." };
  }
}
// 부서 목록 + 집계를 한 번의 호출로 불러와 보관 (서버 호출 횟수 줄이기)
async function loadInit(){
  let r = await api({ action:"init" });
  // 서버(Code.gs)가 아직 예전 버전이면 init이 없으므로, 예전 방식(부서 + 집계 따로)으로 자동 전환
  if(!r.ok && !r.auth){
    const [dr, sr] = await Promise.all([api({ action:"depts" }), api({ action:"summary" })]);
    r = (dr.ok && sr.ok) ? { ok:true, depts:dr.depts, days:sr.days } : (dr.ok ? sr : dr);
  }
  if(r.ok){ setDepts(r.depts); st.days = r.days; }
  return r;
}
function applyResult(r){ if(r.depts) setDepts(r.depts); if(r.days) st.days = r.days; }
function setDepts(list){ DEPTS = Object.fromEntries(list.map(x => [x.id, x.name])); }

/* ---- 미리보기 모드(서버 없이 화면 확인용) ---- */
// 실제 운영(API_URL 입력 후)에서는 아래 미리보기 코드는 쓰이지 않고, 비밀번호는 서버(Code.gs)에서 확인합니다.
const MOCK_PW = "f305ff3f";
function fnv(s){ let h = 0x811c9dc5; for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }
function mockGet(k, init){
  try{ const raw = store.get(k); if(raw) return JSON.parse(raw); }catch(e){}
  const v = init(); store.set(k, JSON.stringify(v)); return v;
}
function mockDepts(){
  // 기본 부서 목록 (미리보기 모드용 — 서버 연결 후에는 구글 시트 '부서목록' 탭을 사용)
  return mockGet("mockdepts3", () => [["A1","한강서부사업단 경영보상부"],["A2","한강서부사업단 공사관리부"],["A3","한강서부사업단 공사1부"],["A4","한강서부사업단 공사2부"],
    ["A5","한강서부사업단 공사3부"],["B1","경기동남권지사 수지운영부"],["X1","외부업체①(가명)"],["X2","외부업체②(가명)"]].map(([id,name]) => ({id,name})));
}
function mockDB(){
  return mockGet("mockdb3", () => {
    // 미리보기 전용 예시 데이터
    const t = kst().date, d = dateList().filter(x => x !== t), ex = {};
    if(!isWeekend(t)) ex[t] = { A2:7, X1:12 };
    ex[d[0]] = { A1:5, A4:9, B1:6 };
    ex[d[2]] = { A3:15 };
    return ex;
  });
}
async function mockApi(p, b){
  await new Promise(r => setTimeout(r, 150));
  const db = mockDB(), depts = mockDepts();
  const names = Object.fromEntries(depts.map(x => [x.id, x.name]));
  const saveDepts = () => store.set("mockdepts3", JSON.stringify(depts));
  if(b && b.action === "admin"){
    if(fnv(b.pw) !== MOCK_PW) return { ok:false, auth:true, error:"비밀번호가 맞지 않습니다." };
    if(b.op === "login") return { ok:true, depts };
    if(b.op === "records"){
      const rows = [];
      Object.keys(db).filter(d => d >= b.from && d <= b.to).sort().forEach(date =>
        Object.keys(db[date]).forEach(id => { if(db[date][id]) rows.push({ date, dept:id, name:names[id] || "삭제된 소속", count:db[date][id] }); }));
      return { ok:true, rows, depts };
    }
    const name = String(b.name || "").replace(/\s+/g," ").trim();
    if(b.op === "add" || b.op === "rename"){
      if(!name) return { ok:false, error:"소속명을 입력해 주세요." };
      if(name.length > 20) return { ok:false, error:"소속명은 20자 이내로 입력해 주세요." };
      if(depts.some(x => x.name === name && x.id !== b.id)) return { ok:false, error:"같은 이름의 소속이 이미 있습니다." };
    }
    if(b.op === "add"){ const id = "D" + Date.now().toString(36).slice(-5).toUpperCase(); depts.push({ id, name }); saveDepts(); return { ok:true, depts, id }; }
    const i = depts.findIndex(x => x.id === b.id);
    if(i < 0) return { ok:false, error:"대상 소속을 찾을 수 없습니다." };
    if(b.op === "rename"){ depts[i].name = name; saveDepts(); return { ok:true, depts }; }
    if(b.op === "delete"){
      if(depts.length <= 1) return { ok:false, error:"소속은 최소 1곳 이상 있어야 합니다." };
      depts.splice(i,1); saveDepts(); return { ok:true, depts };
    }
    return { ok:false, error:"잘못된 요청입니다." };
  }
  if(b){
    if(!names[b.d]) return { ok:false, error:"소속 정보가 올바르지 않습니다. 화면을 새로 고쳐 주세요." };
    if(closed(b.date) && !(lateToday(b.date) && (db[b.date] || {})[b.d])) return { ok:false, error:"오늘 신규 등록은 마감되었습니다. 기존 등록만 수정할 수 있습니다." };
    db[b.date] = db[b.date] || {};
    if(b.count === 0) delete db[b.date][b.d]; else db[b.date][b.d] = b.count;
    store.set("mockdb3", JSON.stringify(db));
    return { ok:true, count:b.count, depts, days:mockDays(db, depts, names) };
  }
  if(p.action === "init") return { ok:true, depts, days:mockDays(db, depts, names) };
  if(p.action === "depts") return { ok:true, depts };
  if(p.action === "get") return { ok:true, count:(db[p.date] || {})[p.d] || 0 };
  if(p.action === "summary") return { ok:true, days:mockDays(db, depts, names) };
  return { ok:false, error:"잘못된 요청입니다." };
}
function mockDays(db, depts, names){
  const today = kst().date, order = depts.map(x => x.id);
  return Object.keys(db).filter(d => d >= today).sort().map(date => {
    const ids = Object.keys(db[date]).filter(id => db[date][id])
      .sort((a,b) => (order.indexOf(a) < 0 ? 999 : order.indexOf(a)) - (order.indexOf(b) < 0 ? 999 : order.indexOf(b)));
    const items = ids.map(id => ({ dept:id, name:names[id] || "삭제된 소속", count:db[date][id] }));
    return { date, total:items.reduce((a,x) => a + x.count, 0), items };
  }).filter(x => x.items.length);
}

/* ---- 화면 2: 부서별 등록·수정 ---- */
function viewForm(){

  if(lateToday(t0) && !(SKIP_WEEKEND && isWeekend(t0))) dates = [t0, ...dates];
  if(!st.date || !dates.includes(st.date)) st.date = dates.find(x => !lateToday(x)) || dates[0];
  st.armed = false;
  app.innerHTML = `
  <div class="formhead"><button class="back" id="home">← 메인</button><b>${esc(DEPTS[st.dept])}</b></div>
  <div class="panel pad">
    <div class="flabel">날짜</div>
    <div class="chips">${dates.map(s => `<button class="chip${s===st.date?" on":""}" data-d="${s}"><span class="tag">${lateToday(s) ? "오늘·수정만" : tagOf(s)}</span><b>${fmt(s)}</b><span class="cnt" data-c="${s}"></span></button>`).join("")}</div>
    <div class="flabel">빠지는 인원</div>
    <div class="stepper">
      <button id="minus" aria-label="1명 줄이기">−</button>
      <input id="num" type="number" inputmode="numeric" min="${MIN_COUNT}" max="${MAX_COUNT}" aria-label="빠지는 인원">
      <button id="plus" aria-label="1명 늘리기">+</button>
    </div>
    <div class="status" id="status"></div>
    <button class="primary" id="save">등록</button>
    <button class="ghost" id="cancel" hidden>등록 취소</button>
    <div class="msg" id="msg" hidden></div>
  </div>
  <p class="foot">날짜 아래 인원 표시는 이미 등록된 내용입니다 · 날짜를 눌러 수정<br>당일 ${deadlineText()} 마감</p>`;

  $("#home").onclick = () => viewHome();
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if(st.busy) return;
    st.date = b.dataset.d; st.armed = false;
    app.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    hideMsg(); loadCurrent();
  });
  $("#minus").onclick = () => { st.value = Math.max(MIN_COUNT, st.value - 1); hideMsg(); updateUI(); };
  $("#plus").onclick  = () => { st.value = Math.min(MAX_COUNT, st.value + 1); hideMsg(); updateUI(); };
  $("#num").onchange  = e => {
    const v = parseInt(e.target.value, 10);
    st.value = isNaN(v) ? (st.current || DEFAULT_COUNT) : Math.min(MAX_COUNT, Math.max(MIN_COUNT, v));
    updateUI();
  };
  $("#save").onclick   = () => doSave(st.value);
  $("#cancel").onclick = () => {          // 실수 방지: 두 번 눌러야 취소
    if(!st.armed){ st.armed = true; updateUI(); return; }
    st.armed = false; doSave(0);
  };
  if(st.days){ fillMine(); loadCurrent(); refreshQuiet(); }   // 보관된 데이터로 즉시 표시 + 뒤에서 최신화
  else { refreshQuiet(true); }
}

// 보관된 집계(st.days)에서 이 부서의 등록 내역을 날짜 칩에 표시
function fillMine(){
  const dept = st.dept;
  st.mine = {};
  (st.days || []).forEach(day => day.items.forEach(i => { if(i.dept === dept) st.mine[day.date] = i.count; }));
  app.querySelectorAll(".chip").forEach(b => {
    const c = st.mine[b.dataset.d];
    b.classList.toggle("has", !!c);
    const el = b.querySelector(".cnt"); if(el) el.textContent = c ? `${c}명` : "";
  });
}

// 선택한 날짜의 현재 등록 인원 (서버 호출 없이 보관 데이터 사용)
function loadCurrent(){
  st.current = st.mine[st.date] || 0;
  st.value = st.current || DEFAULT_COUNT;
  st.busy = false;
  updateUI();
}

// 뒤에서 조용히 최신 데이터 확인 — 사용자가 인원을 바꾸는 중이면 값은 건드리지 않음
async function refreshQuiet(first){
  const dept = st.dept, my = ++st.token;
  if(first){ st.busy = true; $("#status").textContent = "불러오는 중…"; updateUI(true); }
  const r = await loadInit();
  if(my !== st.token || dept !== st.dept || !$("#num")) return;
  if(!r.ok){ st.busy = false; showMsg(r.error, "err"); updateUI(); return; }
  const touched = !first && st.value !== (st.current || DEFAULT_COUNT);
  fillMine();
  if(first || !touched) loadCurrent(); else { st.current = st.mine[st.date] || 0; updateUI(); }
}

function updateUI(loading){
  const num = $("#num"); if(!num) return;
  num.value = st.value;
  if(!loading){
    if(!st.current) $("#status").textContent = "등록된 인원 없음 · 새로 등록합니다";
    else if(st.value === st.current) $("#status").innerHTML = `현재 <b>${st.current}명</b> 등록됨 · −/+로 바꾼 뒤 수정하세요`;
    else {
      const diff = st.value - st.current;
      $("#status").innerHTML = `<b>${st.current}명 → ${st.value}명</b>으로 수정 (${diff > 0 ? "+" : ""}${diff})`;
    }
    if(lateToday(st.date)){
      if(!st.current) $("#status").innerHTML = `<span class="late">오늘 신규 등록은 ${deadlineText()}에 마감되었습니다</span>`;
      else $("#status").innerHTML += `<br><span class="late">마감 후 수정입니다 · 식당 담당자에게도 알려 주세요</span>`;
    }
  }
  const same = !!st.current && st.value === st.current;
  const blocked = lateToday(st.date) && !st.current;
  $("#save").textContent = blocked ? "신규 등록 마감" : !st.current ? "등록" : same ? "변경 사항 없음" : "수정 등록";
  $("#save").disabled = st.busy || same || blocked;
  $("#cancel").hidden = !st.current;
  $("#cancel").textContent = st.armed ? `한 번 더 누르면 ${fmt(st.date)} 등록 취소` : "등록 취소";
  $("#cancel").disabled = st.busy;
}

async function doSave(count){
  if(count !== 0 && count < MIN_COUNT){ showMsg(`${MIN_COUNT}명 이상 입력해 주세요.`, "err"); return; }
  const late = lateToday(st.date);
  if(closed(st.date) && !(late && st.current > 0)){ showMsg("등록이 마감된 날짜입니다. 화면을 새로 고칩니다.", "err"); setTimeout(viewForm, 1200); return; }
  const date = st.date, name = DEPTS[st.dept], prev = st.current, tail = late ? " (마감 후)" : "";
  st.busy = true; st.token++; hideMsg(); updateUI();
  const btn = count ? $("#save") : $("#cancel");
  btn.textContent = "저장 중…";
  const r = await api(null, { d:st.dept, date, count });
  st.busy = false;
  if(r.ok){
    applyResult(r);
    // 완료되면 메인 화면으로 자동 이동 (응답에 담긴 최신 집계로 바로 표시)
    viewHome(!count ? `${name} · ${fmt(date)} 등록 취소 완료${tail}`
      : prev ? `${name} · ${fmt(date)} ${prev}명 → ${count}명 수정 완료${tail}`
      : `${name} · ${fmt(date)} ${count}명 등록 완료`, !!r.days);
    window.scrollTo(0, 0);
    return;
  }
  showMsg(r.error, "err");
  updateUI();
}

function showMsg(t, type){ const m = $("#msg"); if(!m) return; m.className = "msg " + type; m.textContent = t; m.hidden = false; }
function hideMsg(){ const m = $("#msg"); if(m) m.hidden = true; }

    <input id="newName" class="field" placeholder="예: 한강서부 경영보상부 (20자 이내)" maxlength="20" autocomplete="off">
    <button class="abtn add" type="submit">추가</button>
  </form>
  <p class="foot"><b>띄어쓰기 앞은 버튼 윗줄, 뒤는 아랫줄</b>로 표시됩니다. (예: 한강서부 경영보상부)<br>소속명을 바꿔도 기존 등록 내역은 그대로 유지됩니다.<br>삭제한 소속의 기존 등록은 기록에 남고, 새 등록만 막힙니다.<br>소속 전용 링크: 주소 뒤에 <b>?d=ID</b></p>
  <button class="link-out" id="logout">관리자 로그아웃</button>`;

  $("#home").onclick = () => { st.pw = null; st.rec = null; viewHome(); };
  $("#logout").onclick = () => { st.pw = null; st.rec = null; viewHome("관리자에서 로그아웃했습니다."); };
  if(flash) setTimeout(() => { const m = $("#msg"); if(m) m.hidden = true; }, 4000);

  // 감축 기록
  $("#rGo").onclick = () => {
    const f = $("#rFrom").value, t = $("#rTo").value;
    if(!f || !t || f > t){ $("#rOut").innerHTML = `<div class="msg err">시작일과 종료일을 확인해 주세요.</div>`; return; }
    st.range = [f, t]; loadRecords();
  };
  app.querySelectorAll(".qbtn").forEach(b => b.onclick = () => {
    const q = b.dataset.q;
    st.range = q === "w" ? [addDays(kst().date, -6), kst().date] : monthRange(Number(q));
    $("#rFrom").value = st.range[0]; $("#rTo").value = st.range[1];
    loadRecords();
  });
  $("#rDown").onclick = downloadRecords;
  if(st.rec && st.rec.from === st.range[0] && st.rec.to === st.range[1]) renderRecords(); else loadRecords();

  app.querySelectorAll(".arow").forEach(row => {
    const id = row.dataset.id, inp = row.querySelector(".ain"), save = row.querySelector(".save"), del = row.querySelector(".del");
    inp.oninput = () => { save.hidden = inp.value.trim() === inp.dataset.orig; };
    inp.onkeydown = e => { if(e.key === "Enter" && !save.hidden) save.click(); };
    save.onclick = () => adminOp({ op:"rename", id, name:inp.value }, `"${inp.dataset.orig}" → "${inp.value.trim()}" 변경 완료`);
    del.onclick = () => {                  // 실수 방지: 두 번 눌러야 삭제
      if(!del.classList.contains("armed")){
        app.querySelectorAll(".del.armed").forEach(x => { x.classList.remove("armed"); x.textContent = "삭제"; });
        del.classList.add("armed"); del.textContent = "한 번 더"; return;
      }
      adminOp({ op:"delete", id }, `"${inp.dataset.orig}" 삭제 완료`);
    };
  });
  $("#addForm").onsubmit = e => {
    e.preventDefault();
    const name = $("#newName").value.trim();
    if(!name){ viewAdmin("추가할 소속명을 입력해 주세요.", "err"); return; }
    adminOp({ op:"add", name }, `"${name}" 추가 완료`);
  };
}

// 이번 달(0), 지난 달(-1) 등의 [시작일, 종료일]
function monthRange(offset){
  const [y,m] = kst().date.split("-").map(Number);
  const first = new Date(Date.UTC(y, m - 1 + offset, 1));
  const last = new Date(Date.UTC(y, m + offset, 0));
  return [first.toISOString().slice(0,10), last.toISOString().slice(0,10)];
}

async function loadRecords(){
  const [from, to] = st.range;
  $("#rOut").innerHTML = `<div class="empty">불러오는 중…</div>`;
  $("#rDown").disabled = true;
  const r = await api(null, { action:"admin", op:"records", pw:st.pw, from, to });
  if(!$("#rOut")) return;
  if(!r.ok){
    if(r.auth) return viewAdminLogin(r.error);
    $("#rOut").innerHTML = `<div class="msg err">${esc(r.error)}</div>`; return;
  }
  st.rec = { from, to, rows:r.rows, depts:r.depts || [] };
  renderRecords();
}

// 일자 × 소속 표 만들기 (현재 소속 순서 + 삭제된 소속은 뒤에)
function pivot(){
  const rec = st.rec, cols = [], seen = {};
  rec.depts.forEach(d => { if(rec.rows.some(r => r.dept === d.id)){ cols.push({ id:d.id, name:d.name }); seen[d.id] = 1; } });
  rec.rows.forEach(r => { if(!seen[r.dept]){ cols.push({ id:r.dept, name:r.name }); seen[r.dept] = 1; } });
  const byDate = {};
  rec.rows.forEach(r => { (byDate[r.date] = byDate[r.date] || {})[r.dept] = r.count; });
  const dates = Object.keys(byDate).sort();
  const colTotal = cols.map(c => dates.reduce((s,d) => s + (byDate[d][c.id] || 0), 0));
  return { cols, dates, byDate, colTotal, total: colTotal.reduce((a,b) => a + b, 0) };
}

function renderRecords(){
  const out = $("#rOut"); if(!out) return;
  const rec = st.rec;
  if(!rec.rows.length){ out.innerHTML = `<div class="empty">${fmt(rec.from)} ~ ${fmt(rec.to)} 기간에 등록된 감축 인원이 없습니다.</div>`; $("#rDown").disabled = true; return; }
  const p = pivot();
  out.innerHTML = `
  <div class="rsum">${fmt(rec.from)} ~ ${fmt(rec.to)} · <b>${p.dates.length}일</b> · 총 <b>${p.total}명</b> 감축</div>
  <div class="tblwrap"><table class="pv">
    <thead><tr><th>날짜</th>${p.cols.map(c => `<th>${deptLabel(c.name)}</th>`).join("")}<th>합계</th></tr></thead>
    <tbody>${p.dates.map(d => {
      const sum = p.cols.reduce((s,c) => s + (p.byDate[d][c.id] || 0), 0);
      return `<tr><td>${fmt(d)}</td>${p.cols.map(c => `<td>${p.byDate[d][c.id] || ""}</td>`).join("")}<td><b>${sum}</b></td></tr>`;
    }).join("")}</tbody>
    <tfoot><tr><td>합계</td>${p.colTotal.map(n => `<td>${n}</td>`).join("")}<td>${p.total}</td></tr></tfoot>
  </table></div>`;
  $("#rDown").disabled = false;
}

function downloadRecords(){
  if(!st.rec || !st.rec.rows.length) return;
  const p = pivot(), q = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines = [["날짜","요일",...p.cols.map(c => c.name),"합계"].map(q).join(",")];
  p.dates.forEach(d => {
    const vals = p.cols.map(c => p.byDate[d][c.id] || 0);
    lines.push([d, W[dow(d)], ...vals, vals.reduce((a,b) => a + b, 0)].map(q).join(","));
  });
  lines.push(["합계","",...p.colTotal,p.total].map(q).join(","));
  // 엑셀에서 한글이 깨지지 않도록 BOM 포함
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `식수인원_감축기록_${st.rec.from}_${st.rec.to}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function adminOp(payload, okText){
  app.querySelectorAll("button,input").forEach(x => x.disabled = true);
  const r = await api(null, Object.assign({ action:"admin", pw:st.pw }, payload));
  if(r.ok){ setDepts(r.depts); viewAdmin(okText); return; }
  if(r.auth){ return viewAdminLogin(r.error); }
  viewAdmin(r.error, "err");
}

/* ---- 시작 ---- */
(async function init(){
  if(!API_URL) $("#demo").hidden = false;
  $("#adminBtn").onclick = () => st.pw ? viewAdmin() : viewAdminLogin();
  const d = new URLSearchParams(location.search).get("d");   // 부서 전용 링크: ?d=부서ID
  if(d){
    await loadInit();
    if(DEPTS[d]){ st.dept = d; return viewForm(); }
  }
  viewHome();
})();
</script>
